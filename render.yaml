# Render Blueprint — deploys this project as a single Docker-based web
# service, built from the root Dockerfile (Angular frontend + Express
# backend in one image, one URL, no separate frontend deployment).
#
# In Render: New + -> Blueprint -> point at this repo -> Render reads
# this file and builds/runs the Dockerfile automatically.
services:
  - type: web
    name: budget-utilization-monitoring
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false          # set this in the Render dashboard — your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a strong random secret
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_URL
        value: "*"           # same-origin deployment; CORS restriction not required
