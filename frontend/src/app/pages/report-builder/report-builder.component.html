<div class="page-header">
  <div>
    <h1>Custom Report Builder</h1>
    <p style="color:var(--text-muted); margin:0;">Select filters and generate a tailored CSV export</p>
  </div>
</div>

<div class="card" style="margin-bottom:20px;">
  <form [formGroup]="form" (ngSubmit)="generate()">
    <div class="grid grid-3">
      <div class="form-group">
        <label>Department</label>
        <select class="form-control" formControlName="department">
          <option value="">All departments</option>
          <option *ngFor="let d of departments" [value]="d._id">{{ d.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select class="form-control" formControlName="category">
          <option value="">All categories</option>
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
      </div>
      <div class="form-group" style="display:flex; align-items:flex-end;">
        <button class="btn btn-primary" type="submit" style="width:100%;">Generate Report</button>
      </div>
    </div>
  </form>
</div>

<div class="card" *ngIf="generated">
  <div class="page-header" style="margin-bottom:12px;">
    <h3 style="margin:0;">{{ results.length }} result(s)</h3>
    <button class="btn btn-outline btn-sm" (click)="exportCsv()" [disabled]="results.length === 0">Download CSV</button>
  </div>
  <table>
    <thead><tr><th>Date</th><th>Scheme</th><th>Department</th><th>Category</th><th>Amount</th></tr></thead>
    <tbody>
      <tr *ngFor="let e of results">
        <td>{{ e.date | date:'mediumDate' }}</td>
        <td>{{ e.budget?.scheme }}</td>
        <td>{{ e.department?.name }}</td>
        <td>{{ e.expenseCategory }}</td>
        <td>₹{{ e.amountSpent | number }}</td>
      </tr>
      <tr *ngIf="results.length === 0">
        <td colspan="5" style="text-align:center; color:var(--text-muted);">No matching records.</td>
      </tr>
    </tbody>
  </table>
</div>
