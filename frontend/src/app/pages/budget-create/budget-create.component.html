<div class="breadcrumb"><a routerLink="/budgets">Budget Management</a> / New Allocation</div>
<div class="page-header"><h1>New Budget Allocation</h1></div>

<div class="card" style="max-width:700px;">
  <div class="alert-banner error" *ngIf="errorMessage">{{ errorMessage }}</div>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid grid-2">
      <div class="form-group">
        <label>Financial Year</label>
        <select class="form-control" formControlName="financialYear">
          <option value="2024-2025">2024-2025</option>
          <option value="2025-2026">2025-2026</option>
          <option value="2026-2027">2026-2027</option>
        </select>
      </div>
      <div class="form-group">
        <label>Department</label>
        <select class="form-control" formControlName="department">
          <option value="">-- Select --</option>
          <option *ngFor="let d of departments" [value]="d._id">{{ d.name }}</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Scheme / Project Name</label>
      <input class="form-control" formControlName="scheme" placeholder="e.g. Rural Roads Development Scheme" />
    </div>
    <div class="grid grid-2">
      <div class="form-group">
        <label>Allocated Amount (₹)</label>
        <input class="form-control" type="number" formControlName="allocatedAmount" />
      </div>
      <div class="form-group">
        <label>Quarter</label>
        <select class="form-control" formControlName="quarter">
          <option>Annual</option><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea class="form-control" formControlName="notes" rows="3"></textarea>
    </div>
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Save Allocation</button>
  </form>
</div>
