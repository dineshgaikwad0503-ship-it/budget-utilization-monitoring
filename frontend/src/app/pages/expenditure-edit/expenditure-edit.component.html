<div class="breadcrumb"><a routerLink="/expenditures">Expenditure Tracking</a> / Edit Entry</div>
<div class="page-header"><h1>Edit Expenditure</h1></div>

<div class="card" style="max-width:700px;" *ngIf="!loading">
  <div class="alert-banner error" *ngIf="errorMessage">{{ errorMessage }}</div>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid grid-2">
      <div class="form-group">
        <label>Amount Spent (₹)</label>
        <input class="form-control" type="number" formControlName="amountSpent" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select class="form-control" formControlName="expenseCategory">
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="form-group">
        <label>Date</label>
        <input class="form-control" type="date" formControlName="date" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select class="form-control" formControlName="status">
          <option>Pending</option><option>Approved</option><option>Flagged</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input class="form-control" formControlName="description" />
    </div>
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Save Changes</button>
  </form>
</div>
