<div class="page-header">
  <div>
    <h1>Resolved Alerts Archive</h1>
    <p style="color:var(--text-muted); margin:0;">Full history of resolved anomaly alerts for compliance and review</p>
  </div>
</div>

<div class="card">
  <table>
    <thead><tr><th>Type</th><th>Severity</th><th>Department</th><th>Message</th><th>Resolved</th></tr></thead>
    <tbody>
      <tr *ngFor="let a of alerts">
        <td><span class="badge badge-info">{{ a.alertType }}</span></td>
        <td><span class="badge" [ngClass]="a.severity === 'High' || a.severity === 'Critical' ? 'badge-danger' : 'badge-warning'">{{ a.severity }}</span></td>
        <td>{{ a.department?.name }}</td>
        <td style="max-width:400px;">{{ a.message }}</td>
        <td>{{ a.createdAt | date:'mediumDate' }}</td>
      </tr>
      <tr *ngIf="!loading && alerts.length === 0">
        <td colspan="5" style="text-align:center; color:var(--text-muted);">No resolved alerts yet.</td>
      </tr>
    </tbody>
  </table>
</div>
