<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="brand-icon">◈</div>
      <h1>Set New Password</h1>
      <p class="subtitle">Choose a new password for your account.</p>
    </div>

    <div class="alert-banner success" *ngIf="submitted">Password updated. Redirecting to sign in...</div>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!submitted">
      <div class="form-group">
        <label>New Password</label>
        <input class="form-control" type="password" formControlName="password" placeholder="Minimum 6 characters" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input class="form-control" type="password" formControlName="confirmPassword" />
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit" [disabled]="form.invalid">Update Password</button>
    </form>

    <p class="footer-link"><a routerLink="/login">Back to Sign In</a></p>
  </div>
</div>
