<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="brand-icon">◈</div>
      <h1>Forgot Password</h1>
      <p class="subtitle">Enter your registered email and we'll send reset instructions.</p>
    </div>

    <div class="alert-banner success" *ngIf="submitted">
      If an account exists for that email, password reset instructions have been sent.
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!submitted">
      <div class="form-group">
        <label>Email address</label>
        <input class="form-control" type="email" formControlName="email" placeholder="you@department.gov.in" />
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit" [disabled]="form.invalid">
        Send Reset Link
      </button>
    </form>

    <p class="footer-link"><a routerLink="/login">Back to Sign In</a></p>
  </div>
</div>
