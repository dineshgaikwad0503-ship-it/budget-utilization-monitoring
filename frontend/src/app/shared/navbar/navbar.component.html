<header class="navbar">
  <div class="brand">
    <span class="brand-icon">◈</span>
    <div>
      <div class="brand-title">Budget Utilization Monitor</div>
      <div class="brand-subtitle">AI-Based Financial Governance Platform</div>
    </div>
  </div>
  <div class="navbar-right" *ngIf="auth.currentUser() as user">
    <button class="nav-icon-btn" routerLink="/notifications" title="Notifications">
      🔔<span class="nav-dot"></span>
    </button>
    <button class="nav-icon-btn" routerLink="/help" title="Help &amp; FAQs">?</button>
    <div class="user-info" style="cursor:pointer" routerLink="/profile">
      <div class="user-name">{{ user.name }}</div>
      <div class="user-role">{{ user.role }}</div>
    </div>
    <button class="btn btn-outline btn-sm" (click)="logout()">Logout</button>
  </div>
</header>
